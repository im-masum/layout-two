<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Shop3D</title>
    <link rel="stylesheet" href="css/products.css" />
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Shop3D</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cart.html">Cart</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <section class="products-hero">
        <h1>Our Products</h1>
    </section>

    <section class="products-list">
        <!-- Example Product Card -->
        <div class="product-card">
            <img src="img/product1.jpg" alt="Product 1" />
            <h2 class="product-title">3D Printed Vase</h2>
            <p class="product-desc">Beautiful modern vase for your home.</p>
            <div class="product-price">$25.00</div>
            <button class="add-cart-btn">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="img/product2.jpg" alt="Product 2" />
            <h2 class="product-title">3D Keychain</h2>
            <p class="product-desc">Customizable keychain with your name.</p>
            <div class="product-price">$8.00</div>
            <button class="add-cart-btn">Add to Cart</button>
        </div>
        <div class="product-card">
            <img src="img/product3.jpg" alt="Product 3" />
            <h2 class="product-title">3D Lamp</h2>
            <p class="product-desc">Unique lamp for your desk or bedside.</p>
            <div class="product-price">$40.00</div>
            <button class="add-cart-btn">Add to Cart</button>
        </div>
        <!-- Add more product cards as needed -->
    </section>

    <script src="js/products.js"></script>
</body>
</html>
